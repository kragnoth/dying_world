#Flat XP level cost applied to every anvil transfer, before enchantment cost is added.
# Default: 1
# Range: > 0
baseLevelCost = 1
#Extra XP levels charged per enchantment level being transferred from the left item.
# Default: 1
# Range: > 0
levelCostPerEnchantmentLevel = 1
#If true, the 'prior work' repair cost penalty of both items is added to the level cost, like vanilla anvils do.
includeRepairCost = true
#If true, transfers that would cost 40 or more levels are blocked for survival players, matching vanilla's 'Too Expensive!' anvil behavior. Set to false to allow transfers of any cost.
enforceLevelCap = false
