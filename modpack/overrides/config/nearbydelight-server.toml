#If false, no station (Cooking Pot, Monster Pot, Smoker) will search nearby containers for anyone on this server
nearbyCookingEnabled = true
#If false, the vanilla Smoker won't pull from nearby containers for anyone on this server
smokerEnabled = true
#If false, Dungeons Delight's Monster Pot won't pull from nearby containers for anyone on this server
dungeonsDelightEnabled = true
#The biggest search radius players are allowed to use
# Default: 16
# Range: 1 ~ 16
maxSearchRadius = 16
