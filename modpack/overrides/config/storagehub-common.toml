[scan]
	#Horizontal (X/Z) radius, in blocks, that a Storage Link block will scan for linkable inventories.
	# Default: 5
	# Range: 1 ~ 32
	scanRadiusXZ = 5
	#Vertical (Y) radius, in blocks, that a Storage Link block will scan for linkable inventories.
	# Default: 2
	# Range: 1 ~ 32
	scanRadiusY = 2
	#How often (in ticks) the block re-scans its surroundings for new/removed inventories.
	#20 ticks = 1 second.
	# Default: 20
	# Range: 5 ~ 200
	rescanIntervalTicks = 20

[gui]
	#Maximum number of combined slots shown at once in the Storage Link UI.
	#The screen renders these as up to 6 rows of 9 (the vanilla double-chest
	#texture), so this should stay a multiple of 9, max 54, until real
	#pagination/scrolling is added to replace this truncation.
	# Default: 54
	# Range: 9 ~ 54
	maxDisplayedSlots = 54
